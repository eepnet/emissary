[package]
name = "emissary-util"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
emissary-core = { path = "../emissary-core", version = "0.4.0", default-features = false, features = ["std"] }
flate2 = { workspace = true }
home = "=0.5.11"
igd-next = { version = "0.16.1", default-features = false, features = ["aio_tokio"] }
metrics-exporter-prometheus = { version = "0.17.2", optional = true }
metrics = { version = "0.24.2", optional = true }
natpmp = "0.5.0"
netdev = { version = "0.36.0", default-features = false, features = ["gateway"] }
pem = { version = "3.0.5", default-features = false }
rsa = { version = "0.9.10", features = ["sha2"] }
x509-parser = "0.17.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib"] }

# workspace dependencies
anyhow = { workspace = true }
ed25519-dalek = { workspace = true, features = ["rand_core", "fast"] }
futures = { workspace = true }
nom = { workspace = true, features = ["alloc"] }
rand = { workspace = true, features = ["thread_rng"] }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
smol = { workspace = true, optional = true }
socket2 = { workspace = true }
tempfile = { workspace = true }
tokio-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
toml = { workspace = true }
tracing = { workspace = true, features = ["log"] }
x25519-dalek = { workspace = true, features = ["getrandom", "static_secrets", "precomputed-tables"] }

[features]
# TLS backend for the HTTPS reseeder. `native-tls` (the default) keeps the
# existing behaviour (OpenSSL/Schannel/Secure Transport). `rustls` selects a
# pure-Rust stack so the crate cross-compiles without OpenSSL, e.g. to Android
# and iOS. Enable exactly one: `default-features = false` + `features = ["rustls"]`.
default = ["tokio", "native-tls"]
tokio = ["dep:tokio", "dep:tokio-util"]
smol = ["dep:smol"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
native-tls = ["reqwest/default-tls"]
rustls = ["reqwest/rustls-tls"]
